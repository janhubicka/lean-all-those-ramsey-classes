name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Lean source scanner
        run: python3 -m unittest discover -s scripts -p 'test_lean_source.py'
      - name: Review retired-module plan
        run: python3 scripts/cleanup_inventory.py --verify
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for Lean caches
        run: |
          set -euo pipefail
          df -h .
          # Neither Android, .NET nor CodeQL are needed for Lean/Mathlib.
          # The full Lake cache plus the Lean toolchain can otherwise
          # exhaust the standard hosted runner before Lean is installed.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h .
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Plan retired proof cleanup
        run: python3 scripts/cleanup_inventory.py --verify
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup
      - name: Build all project modules
        run: |
          set -euo pipefail
          mapfile -t modules < <(find AllThoseRamseyClasses -name '*.lean' -type f | sort | sed -e 's#/#.#g' -e 's#\.lean$##')
          lake build AllThoseRamseyClasses "${modules[@]}"
      - name: Audit import graph and source integrity
        run: python3 scripts/audit_library.py
      - name: Audit conditional Section 3 theorem contracts
        run: python3 scripts/audit_lift_contracts.py
      - name: Check theorem axioms
        run: |
          set -euo pipefail
          : > axioms.log
          for audit in CheckAxioms*.lean; do
            lake env lean "$audit" >> axioms.log 2>&1 || { tail -100 axioms.log; exit 1; }
          done
          python3 scripts/check_axioms.py axioms.log CheckAxioms*.lean
      # Admission and unauthorised-axiom checks already run above in
      # scripts/audit_library.py, using executable_text from lean_source.py
      # (comments, including words such as "admit", are not executable Lean).
      # Keep one authoritative comment-aware source audit instead of a
      # second raw grep check that rejects harmless prose.
