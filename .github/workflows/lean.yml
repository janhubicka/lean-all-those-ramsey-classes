name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup
      - name: Build all project modules
        run: |
          set -euo pipefail
          lake build AllThoseRamseyClasses
      - name: Check theorem axioms
        run: |
          set -euo pipefail
          lake env lean CheckAxioms.lean > axioms.log 2>&1 || { tail -100 axioms.log; exit 1; }
          python3 scripts/check_axioms.py axioms.log CheckAxioms.lean
      - name: Finite paired-equivalence counterexample regression
        run: python3 scripts/check_paired_equivalences.py
      - name: Bounded strong-amalgamation regression (72839 spans)
        run: python3 scripts/check_paired_strong_amalgamation.py
      - name: Verify literal source is free of admissions
        run: |
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)[[:space:]]*($|[^[:alnum:]_])' AllThoseRamseyClasses CheckAxioms.lean; then
            echo "Lean admission found" >&2
            exit 1
          fi
